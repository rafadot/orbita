<button
  type="button"
  class="alternador-tema"
  [class.alternador-tema--pulso]="pulsando()"
  aria-label="Alternar tema"
  [style.--dl-accent]="acento()"
  (click)="aoClicar()"
>
  <svg class="alternador-tema__svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle
      class="anel"
      cx="12"
      cy="12"
      r="9.2"
      fill="none"
      stroke="currentColor"
      stroke-width="0.5"
      stroke-dasharray="1.6 2.4"
    />
    <g class="satelites">
      <circle cx="12" cy="3" r="2.2" fill="currentColor" />
      <circle cx="18.36" cy="5.64" r="1.15" fill="currentColor" />
      <circle cx="21" cy="12" r="1.5" fill="currentColor" />
      <circle cx="18.36" cy="18.36" r="1.2" fill="currentColor" />
      <circle cx="12" cy="21" r="2.1" fill="currentColor" />
      <circle cx="5.64" cy="18.36" r="1.2" fill="currentColor" />
      <circle cx="3" cy="12" r="1.85" fill="currentColor" />
      <circle cx="5.64" cy="5.64" r="1.55" fill="currentColor" />
    </g>
    <circle class="nucleo" cx="12" cy="12" r="4.6" fill="currentColor" />
  </svg>
</button>
