<div class="carregando" role="status" aria-busy="true">
  <!-- desktop: coluna da órbita + coluna com 3 cartões -->
  <div class="carregando__desktop">
    <div class="cartao carregando__coluna-orbita">
      <div class="carregando__linhas">
        <span class="carregando__bloco carregando__bloco--eyebrow-orbita"></span>
        <span class="carregando__bloco carregando__bloco--tom-medio carregando__bloco--titulo-orbita"></span>
      </div>
      <div class="carregando__anel">
        <span class="carregando__nucleo"></span>
      </div>
      <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--painel"></span>
    </div>

    <div class="carregando__coluna-lista">
      <div class="cartao carregando__cartao carregando__cartao--gap-16">
        <span class="carregando__bloco carregando__bloco--eyebrow-card"></span>
        <span class="carregando__bloco carregando__bloco--tom-medio carregando__bloco--valor"></span>
        <span class="carregando__bloco carregando__bloco--tom-medio carregando__bloco--barra"></span>
        <div class="carregando__grade carregando__grade--3">
          <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--celula"></span>
          <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--celula"></span>
          <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--celula"></span>
        </div>
      </div>

      <div class="cartao carregando__cartao">
        <span class="carregando__bloco carregando__bloco--titulo-card2"></span>
        <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--linha"></span>
        <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--linha"></span>
        <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--linha"></span>
      </div>

      <div class="cartao carregando__cartao carregando__cartao--duas-colunas">
        <div class="carregando__coluna-metade">
          <span class="carregando__bloco carregando__bloco--titulo-col"></span>
          <span class="carregando__bloco carregando__bloco--tom-medio carregando__bloco--barra-col"></span>
        </div>
        <div class="carregando__coluna-metade">
          <span class="carregando__bloco carregando__bloco--titulo-col"></span>
          <span class="carregando__bloco carregando__bloco--tom-medio carregando__bloco--barra-col"></span>
        </div>
      </div>

      <div class="carregando__spinner-linha">
        <span class="spinner" aria-hidden="true"></span>
        <span class="carregando__texto">Carregando sua órbita — costuma levar alguns segundos.</span>
      </div>
    </div>
  </div>

  <!-- mobile: bloco de destaque + grade de áreas + lista + spinner -->
  <div class="carregando__mobile">
    <span class="carregando__bloco carregando__bloco--hero"></span>

    <div class="cartao carregando__cartao carregando__cartao--mobile carregando__cartao--mobile-gap-10">
      <span class="carregando__bloco carregando__bloco--titulo-sm"></span>
      <div class="carregando__grade carregando__grade--4">
        <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--icone"></span>
        <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--icone"></span>
        <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--icone"></span>
        <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--icone"></span>
        <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--icone"></span>
        <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--icone"></span>
        <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--icone"></span>
        <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--icone"></span>
      </div>
    </div>

    <div class="cartao carregando__cartao carregando__cartao--mobile carregando__cartao--mobile-gap-12">
      <span class="carregando__bloco carregando__bloco--titulo-card2b"></span>
      <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--linha-mobile"></span>
      <span class="carregando__bloco carregando__bloco--tom-claro carregando__bloco--linha-mobile"></span>
    </div>

    <div class="carregando__spinner-linha carregando__spinner-linha--mobile">
      <span class="spinner" aria-hidden="true"></span>
      <span class="carregando__texto carregando__texto--mobile">Carregando sua órbita…</span>
    </div>
  </div>
</div>
