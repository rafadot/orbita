spring.application.name=api-orbita

# Banco de dados — credenciais só via variavel de ambiente, nunca hardcoded.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DDL e schema sempre via Flyway, nunca o Hibernate criando/alterando tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Erros como application/problem+json (RFC 9457) em toda resposta de erro.
spring.mvc.problemdetails.enabled=true

# JWT — segredo via variável de ambiente, sem default (>= 32 bytes).
orbita.auth.jwt-secret=${ORBITA_JWT_SECRET}
orbita.auth.duracao-token-acesso=PT15M
orbita.auth.duracao-token-atualizacao=P1D
orbita.auth.duracao-token-atualizacao-mantendo-conectado=P30D
orbita.auth.duracao-confirmacao-email=PT30M
orbita.auth.intervalo-minimo-reenvio-email=PT1M
orbita.auth.numero-maximo-tentativas-login=5
orbita.auth.duracao-bloqueio-login=PT15M

# URL do front — usada para montar o link de confirmacao de e-mail.
orbita.frontend-url=${ORBITA_FRONTEND_URL}
